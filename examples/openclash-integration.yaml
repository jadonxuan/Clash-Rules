# =============================================================================
# OpenClash 集成示例（合并进 /etc/openclash/LSDL.yaml）
# 20 个 rule-providers + 相应 rules 段
# 全部来自你自己的 jadonxuan/Clash-Rules 仓库
# =============================================================================

rule-anchor:
  ip:     &ip     { type: http, interval: 86400, behavior: ipcidr,    format: yaml }
  domain: &domain { type: http, interval: 86400, behavior: domain,    format: yaml }
  class:  &class  { type: http, interval: 86400, behavior: classical, format: yaml }

rule-providers:
  # ---------- 手写：自定义 ----------
  custom_proxy:    { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/custom_proxy.yaml",    path: ./ruleset/custom_proxy.yaml }
  custom_direct:   { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/custom_direct.yaml",   path: ./ruleset/custom_direct.yaml }
  custom_reject:   { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/custom_reject.yaml",   path: ./ruleset/custom_reject.yaml }

  # ---------- 手写：按厂商 domain ----------
  ai:              { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/ai.yaml",              path: ./ruleset/ai.yaml }
  tiktok:          { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/tiktok.yaml",          path: ./ruleset/tiktok.yaml }
  youtube:         { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/youtube.yaml",         path: ./ruleset/youtube.yaml }
  google:          { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/google.yaml",          path: ./ruleset/google.yaml }
  github:          { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/github.yaml",          path: ./ruleset/github.yaml }
  telegram:        { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/telegram.yaml",        path: ./ruleset/telegram.yaml }
  netflix:         { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/netflix.yaml",         path: ./ruleset/netflix.yaml }
  paypal:          { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/paypal.yaml",          path: ./ruleset/paypal.yaml }
  onedrive:        { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/onedrive.yaml",        path: ./ruleset/onedrive.yaml }
  microsoft:       { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/microsoft.yaml",       path: ./ruleset/microsoft.yaml }
  apple:           { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/apple.yaml",           path: ./ruleset/apple.yaml }
  speedtest:       { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/speedtest.yaml",       path: ./ruleset/speedtest.yaml }
  private_domain:  { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/private_domain.yaml",  path: ./ruleset/private_domain.yaml }

  # ---------- 手写：按厂商 IP ----------
  private_ip:      { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/ip/private_ip.yaml",         path: ./ruleset/private_ip.yaml }
  google_ip:       { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/ip/google_ip.yaml",          path: ./ruleset/google_ip.yaml }
  apple_ip:        { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/ip/apple_ip.yaml",           path: ./ruleset/apple_ip.yaml }
  telegram_ip:     { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/ip/telegram_ip.yaml",        path: ./ruleset/telegram_ip.yaml }
  netflix_ip:      { <<: *class,  url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/ip/netflix_ip.yaml",         path: ./ruleset/netflix_ip.yaml }

  # ---------- Mirror：大表（Actions 自动同步） ----------
  cn_domain:            { <<: *class, url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/mirror/cn_domain.yaml",            path: ./ruleset/cn_domain.yaml }
  geolocation_not_cn:   { <<: *class, url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/rules/mirror/geolocation-not-cn.yaml",   path: ./ruleset/geolocation-not-cn.yaml }
  cn_ip:                { <<: *class, url: "https://raw.githubusercontent.com/jadonxuan/Clash-Rules/main/ip/mirror/cn_ip.yaml",                   path: ./ruleset/cn_ip.yaml }

# -----------------------------------------------------------------------------
# rules 段：顺序 = 优先级
# -----------------------------------------------------------------------------
rules:
  # 内网/本地
  - RULE-SET,private_ip,DIRECT
  - RULE-SET,private_domain,DIRECT

  # 广告/遥测拦截
  - RULE-SET,custom_reject,REJECT

  # ⭐ 覆盖 cn_domain 误判（必须在 cn_domain 之前）
  - RULE-SET,custom_proxy,🚀 默认代理

  # 你个人的直连补充
  - RULE-SET,custom_direct,DIRECT

  # 按服务分流
  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,github,🚀 默认代理
  - RULE-SET,telegram,🚀 默认代理
  - RULE-SET,telegram_ip,🚀 默认代理
  - RULE-SET,netflix,🚀 默认代理
  - RULE-SET,netflix_ip,🚀 默认代理
  - RULE-SET,paypal,🚀 默认代理
  - RULE-SET,tiktok,🎵 TikTok
  - RULE-SET,youtube,📹 YouTube
  - RULE-SET,google,🍀 Google
  - RULE-SET,google_ip,🍀 Google
  - RULE-SET,apple,DIRECT
  - RULE-SET,apple_ip,DIRECT
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,onedrive,DIRECT
  - RULE-SET,speedtest,DIRECT

  # 中国域名/IP（mirror 大表）
  - RULE-SET,cn_domain,DIRECT
  - RULE-SET,cn_ip,DIRECT

  # 境外
  - RULE-SET,geolocation_not_cn,🚀 默认代理

  # 兜底
  - MATCH,🐟 漏网之鱼

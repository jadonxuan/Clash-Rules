  # ==========================================
  # 你的个人直连补充（不依赖 cn_domain 大表）
  # cn_domain 已在 rules/mirror/cn_domain.yaml 中覆盖国内域名
  # 这里只写你**个人特有**的直连域
  # ==========================================

  # 本地 NAS / 家庭服务
  - 'DOMAIN-SUFFIX,ppnas.com'

  # 你在境外注册但服务在国内 or 想强制直连的域
  # 示例：（按需追加）
  # - 'DOMAIN-SUFFIX,myhome.example.com'

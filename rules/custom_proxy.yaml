  # ==========================================
  # ⭐ 核心作用：覆盖 cn_domain 的误判
  # 这些域名在 .cn / 看似中国域名，但服务器在境外 → 走代理才能通
  # 日志证据：cn_domain 命中后走直连 → AWS 海外 IP → i/o timeout
  # ==========================================
  - 'DOMAIN-SUFFIX,tnjxaon.cn'        # hxaws / hkapp / hxapp（AWS 东京）
  - 'DOMAIN-SUFFIX,jbexix.cn'         # hkfwq（境外解析）
  - 'DOMAIN-SUFFIX,kunlun05dns.com'   # ppg-us 代理节点
  - 'DOMAIN-SUFFIX,onblix.com'        # mail/nak/cha/nak2/assets

  # ==========================================
  # 你个人的境外服务白名单（按需追加）
  # ==========================================
  # 示例：
  # - 'DOMAIN-SUFFIX,myservice.example.com'
